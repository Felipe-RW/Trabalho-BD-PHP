<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Dados Embrapa</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>Embrapa</h1>
    </header>
    <main class="pagina-login">
        <h2>Login</h2>
        <div class="frame_login">
            <div class="login_texto">
                <h1>Bem-vindo à Embrapa!</h1>
                <p>Entre com seu e-mail e sua senha para continuar.</p>

                <div id="mensagem-login" class="mensagem-erro-login" role="alert" hidden>
                    E-mail ou senha incorretos, ou usuário desativado.
                </div>

                <form class="formulario_login" action="includes/autenticacao_cargo.php" method="POST">

                    <div class="campo_email">
                        <label for="email">Seu E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                    </div>

                    <div>
                        <label for="senha">Sua Senha:</label>
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                    </div>

                    <button class="btn btn_login" type="submit">Entrar</button>

                </form>

            </div>
        </div>
    </main>
    <script>
        const parametros = new URLSearchParams(window.location.search);
        if (parametros.get('erro') === 'login') {
            document.getElementById('mensagem-login').hidden = false;
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
    <footer>
        <p>Projeto de Banco de Dados</p>
    </footer>
</body>
</html>
